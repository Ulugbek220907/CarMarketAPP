databases:
  - name: carmarket-db
    databaseName: carmarket
    user: carmarket_user
    plan: starter
    region: oregon

services:
  - type: web
    name: carmarket-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: carmarket-db
          property: connectionString
